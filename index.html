<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <title>Pakistan AI — Discover Pakistan. Ask Anything.</title>
    <meta name="description" content="Pakistan AI is an interactive encyclopedia, tourism guide, and AI assistant for everything about Pakistan — history, culture, geography, statistics, and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-offwhite text-charcoal-900 font-body antialiased">
    <div id="root"></div>

    <!-- GTranslate Website Translator Widget -->
    <div class="gtranslate_wrapper"></div>
    <script>
      window.gtranslateSettings = {
        "default_language": "en",
        "native_language_names": true,
        "languages": ["en", "ur", "fr", "es", "zh-CN", "it", "ru", "uk", "ar", "hi", "az", "ja", "de", "nl", "no"],
        "wrapper_selector": ".gtranslate_wrapper",
        "flag_style": "3d",
        "horizontal_position": "left",
        "vertical_position": "bottom"
      };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

    <script type="module" src="./main.jsx"></script>
  </body>
</html>
